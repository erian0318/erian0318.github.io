<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erian — graphic designer</title>
<meta name="description" content="Portfolio of a graphic designer.">
<style>
@font-face{font-family:"Plex";src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Fell";src:url(fonts/im-fell-english-latin-400-normal.woff2) format("woff2");font-display:swap}
:root{--bg:#0E0F10;--ash:#CFCBC0;--smoke:#7C7E7A;--ember:#E2561C;
 --pw:min(86vw,49vh);--ease:cubic-bezier(.22,.7,.2,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ash);overflow:hidden;font-family:Plex,"Courier New",monospace}
.scene{position:fixed;inset:0;overflow:hidden}
.table{position:absolute;left:0;right:0;bottom:0;height:52%;background:url(assets/table.jpg) center/cover;
  -webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%);opacity:.85}
.butt{position:absolute;width:clamp(80px,13vw,190px);filter:brightness(.8)}
.spot{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse calc(var(--pw)*.95) calc(var(--pw)*1.05) at 50% 50%,rgba(5,6,6,0) 0%,rgba(5,6,6,.6) 55%,rgba(5,6,6,.94) 100%)}
.stage{position:absolute;left:50%;top:48%;width:var(--pw);aspect-ratio:2/3;transform:translate(-50%,-50%) rotate(-1deg)}
.stage::before{content:"";position:absolute;left:6%;right:-4%;bottom:-2.5%;height:6%;
  background:radial-gradient(ellipse,rgba(0,0,0,.9),transparent 70%);filter:blur(6px)}
.pack{position:absolute;inset:0;width:100%;height:100%;filter:brightness(.8) contrast(1.05) saturate(.85)}
.cigs{position:absolute;inset:0;clip-path:inset(0 0 62.2% 0)}
.cig{position:absolute;top:30.6%;width:10.2%;
  transition:transform 1s var(--ease),filter 1s var(--ease);filter:brightness(.55) contrast(1.05)}
.cig img{display:block;width:100%;height:auto}
.cig.on{transform:translateY(-24%);filter:brightness(.98) drop-shadow(0 0 14px rgba(226,86,28,.22))}
.hits{position:absolute;inset:0}
.hit{position:absolute;top:14%;height:46%;display:block;outline:none;cursor:pointer}
.hit:focus-visible{outline:1px dashed var(--ember);outline-offset:3px}
.label{position:absolute;left:0;right:0;top:calc(100% + 28px);text-align:center;height:1.4em;
  font:400 clamp(15px,2.2vh,20px)/1.4 Fell,Georgia,serif;letter-spacing:.18em;color:var(--ember);
  text-shadow:0 0 14px rgba(226,86,28,.5);opacity:0;transition:opacity .6s var(--ease)}
.label.show{opacity:1}
.title{position:fixed;left:clamp(16px,3vw,40px);top:clamp(14px,3vh,34px);z-index:6;font:400 clamp(20px,3vh,28px)/1 Fell,Georgia,serif;letter-spacing:.06em;color:var(--ash);opacity:.8}
.title small{display:block;margin-top:8px;font:400 11px/1.3 Plex,monospace;letter-spacing:.12em;color:var(--smoke)}
.hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;z-index:6;font-size:11px;letter-spacing:.12em;color:var(--smoke)}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at 50% 48%,transparent 40%,rgba(0,0,0,.8) 100%);animation:fl 9s infinite}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:9;opacity:.08;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  animation:gr 1s steps(4) infinite}
@keyframes gr{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
@keyframes fl{0%,93%,100%{opacity:1}95%{opacity:.8}97%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.grain,.vignette{animation:none}.cig,.label{transition-duration:.01s}}
</style>
</head>
<body>
<div class="scene">
  <div class="table"></div>
  <img class="butt" src="assets/butt-1.webp" alt="" style="left:5%;bottom:9%;transform:rotate(-8deg)">
  <img class="butt" src="assets/butt-4.webp" alt="" style="right:4%;bottom:14%;transform:rotate(6deg);width:clamp(90px,15vw,220px)">
  <img class="butt" src="assets/butt-3.webp" alt="" style="left:19%;bottom:3%;transform:rotate(12deg);width:clamp(70px,10vw,150px)">
  <img class="butt" src="assets/butt-2.webp" alt="" style="right:20%;bottom:4%;transform:rotate(-5deg);width:clamp(70px,10vw,150px)">
  <div class="spot"></div>
  <main class="stage" id="stage">
    <img class="pack" src="assets/pack.webp" alt="An opened, worn cigarette pack">
    <div class="cigs" id="cigs"></div>
    <div class="hits" id="hits"></div>
    <div class="label" id="label" aria-hidden="true"></div>
  </main>
</div>
<div class="title">Erian<small>graphic designer</small></div>
<div class="hint" id="hint"></div>
<div class="vignette"></div><div class="grain"></div>
<script>
// Edit here: one entry per cigarette. Pages in /works come in the next step.
const PROGRAMS=[
 {label:"Photoshop",  img:"assets/cig-ps.webp", href:"works/photoshop.html"},
 {label:"Illustrator",img:"assets/cig-ai.webp", href:"works/illustrator.html"},
 {label:"InDesign",   img:"assets/cig-id.webp", href:"works/indesign.html"},
 {label:"Figma",      img:"assets/cig-fg.webp", href:"works/figma.html"},
 {label:"Fusion",     img:"assets/cig-fu.webp", href:"works/fusion.html"}
];
const X0=245/1024*100, PITCH=109/1024*100;
const cigs=document.getElementById("cigs"),hits=document.getElementById("hits"),label=document.getElementById("label");
const touch=matchMedia("(hover: none)").matches;
document.getElementById("hint").textContent=touch?"tap a cigarette to pull it out · tap again to light up":"take your time";
const items=[];let active=-1,timer,lastType="mouse";
PROGRAMS.forEach((p,i)=>{
  const left=(X0+i*PITCH).toFixed(2)+"%";
  const c=document.createElement("div");c.className="cig";c.style.left=left;
  c.innerHTML=`<img src="${p.img}" alt="" draggable="false">`;cigs.appendChild(c);
  const a=document.createElement("a");a.className="hit";a.href=p.href;a.style.left=left;a.style.width=PITCH+"%";
  a.setAttribute("aria-label",p.label);hits.appendChild(a);items.push(c);
  a.addEventListener("pointerdown",e=>lastType=e.pointerType);
  a.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"){clearTimeout(timer);timer=setTimeout(()=>show(i),90)}});
  a.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"){clearTimeout(timer);hide(i)}});
  a.addEventListener("focus",()=>show(i));a.addEventListener("blur",()=>hide(i));
  a.addEventListener("click",e=>{if(lastType==="touch"&&active!==i){e.preventDefault();show(i)}});
});
function show(i){if(active>-1&&active!==i)items[active].classList.remove("on");
  active=i;items[i].classList.add("on");label.textContent=PROGRAMS[i].label;label.classList.add("show")}
function hide(i){items[i].classList.remove("on");if(active===i){active=-1;label.classList.remove("show")}}
document.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"&&!e.target.closest(".hit")&&active>-1)hide(active)});
</script>
</body>
</html>
